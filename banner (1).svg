<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Rupee Tracker</title>
  <desc id="d">Animated banner for Rupee Tracker, a PKR remittance calculator</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042f2e">
        <animate attributeName="stop-color" values="#042f2e;#064e3b;#042f2e" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0f766e">
        <animate attributeName="stop-color" values="#0f766e;#115e59;#0f766e" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <clipPath id="typing">
      <rect x="300" y="168" height="40" width="0">
        <animate attributeName="width" values="0;640;640;0" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .sym { font-weight: 700; font-size: 64px; fill: #fbbf24; opacity: .16; animation: float 6s ease-in-out infinite; }
    .s2 { animation-delay: -1.5s; } .s3 { animation-delay: -3s; } .s4 { animation-delay: -4.5s; }
    .title { font-weight: 800; font-size: 64px; fill: url(#gold); animation: rise 1.2s ease-out both; }
    .sub { font-size: 24px; fill: #ccfbf1; }
    .cursor { fill: #fbbf24; animation: blink 1s steps(1) infinite; }
    .pill { fill: rgba(255,255,255,.08); stroke: rgba(251,191,36,.5); stroke-width: 1.5; animation: pulse 3s ease-in-out infinite; transform-origin: 600px 250px; }
    .pilltext { font-size: 18px; font-weight: 600; fill: #fde68a; letter-spacing: 1px; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  </style>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>

  <text class="sym"      x="70"   y="120">₨</text>
  <text class="sym s2"   x="190"  y="250">$</text>
  <text class="sym s3"   x="980"  y="110">د.إ</text>
  <text class="sym s4"   x="1070" y="250">﷼</text>

  <text class="title" x="600" y="130" text-anchor="middle">Rupee Tracker</text>

  <g clip-path="url(#typing)">
    <text class="sub" x="600" y="196" text-anchor="middle">Live PKR remittance calculator · USD · AED · SAR</text>
  </g>
  <rect class="cursor" x="944" y="172" width="3" height="30"/>

  <rect class="pill" x="440" y="228" width="320" height="44" rx="22"/>
  <text class="pilltext" x="600" y="256" text-anchor="middle">PKR ⇄ USD · AED · SAR</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
